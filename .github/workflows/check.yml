name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vendored files match the lock
        run: python -I tools/vendor.py check
      - name: Tests
        run: python -I -m unittest discover -s tests
      - name: Release state is consistent
        run: python -I tools/release.py check
